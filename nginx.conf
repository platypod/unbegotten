# Static server config for the shipped image (see Dockerfile).
#
# **Why this file exists at all.** The image used to ship no nginx config,
# so it served `nginx:alpine`'s stock default: static files with
# `Last-Modified` and `ETag`, but no `Cache-Control` whatsoever. A response
# with no `Cache-Control` sends the browser into *heuristic caching* — it
# invents a freshness lifetime, conventionally about 10% of the age since
# `Last-Modified`, and reuses the file without asking. That is exactly what
# happened after the v0.16.0 release: the new build was deployed and healthy,
# and the browser kept serving the old bundle until a hard reload. Nothing was
# misconfigured; the server simply never said anything about caching, so the
# browser guessed.
#
# `no-cache` does **not** mean "do not store". It means "store, but
# revalidate before use": the browser sends `If-None-Match`, nginx answers
# `304 Not Modified` in a few hundred bytes, and the 30 MB bundle only
# crosses the wire when it has genuinely changed. The caching is kept; only
# the staleness is lost.
#
# Both files need it, and for the same reason: neither carries a version or a
# content hash in its name, so their URLs are identical across every release.
# If the bundle ever does get a hashed filename, that one can move to
# `immutable` with a long `max-age` and skip revalidation entirely — but then
# `index.html`, which names it, must stay `no-cache` or nothing would ever
# learn the new name.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The bundle carries a content hash in its name (stamp.sh), so this exact
    # URL can only ever mean this exact build — nothing to revalidate, ever.
    # A new build is a new URL, which is why staleness is now structurally
    # impossible here rather than merely discouraged.
    location ~ ^/game\.[0-9a-f]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
